apiVersion: v1
kind: Pod
metadata:
  name: storage-test
  namespace: storage-test
spec:
  containers:
    - name: storage-test
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          echo "Longhorn persistent storage test" > /data/test.txt
          echo "Created: $(date)" >> /data/test.txt
          echo "Node: $NODE_NAME" >> /data/test.txt
          sleep infinity

      env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

      volumeMounts:
        - name: data
          mountPath: /data

  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: longhorn-test
