name: Validate Kubernetes Manifests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install yamllint
        run: |
          python3 -m pip install yamllint

      - name: Lint YAML
        shell: bash
        run: |
          set -euo pipefail

          ROOTS=()

          for dir in bootstrap clusters platform apps; do
            if [[ -d "$dir" ]]; then
              ROOTS+=("$dir")
            fi
          done

          echo "Scanning directories:"
          printf ' - %s\n' "${ROOTS[@]}"

          mapfile -d '' YAML_FILES < <(
            find "${ROOTS[@]}" \
              -type f \
              \( -name "*.yaml" -o -name "*.yml" \) \
              -print0
          )

          if [[ ${#YAML_FILES[@]} -eq 0 ]]; then
            echo "No YAML files found."
            exit 0
          fi

          echo "Linting ${#YAML_FILES[@]} YAML file(s)..."

          yamllint "${YAML_FILES[@]}"

      - name: Install kubeconform
        run: |
          curl -L \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            -o kubeconform.tar.gz

          tar -xzf kubeconform.tar.gz

          chmod +x kubeconform

      - name: Validate Kubernetes manifests
        shell: bash
        run: |
          set -euo pipefail

          ROOTS=()

          for dir in bootstrap clusters platform apps; do
            if [[ -d "$dir" ]]; then
              ROOTS+=("$dir")
            fi
          done

          mapfile -d '' MANIFESTS < <(
            find "${ROOTS[@]}" \
              -type f \
              \( -name "*.yaml" -o -name "*.yml" \) \
              ! -name "values.yaml" \
              -print0
          )

          if [[ ${#MANIFESTS[@]} -eq 0 ]]; then
            echo "No Kubernetes manifests found."
            exit 0
          fi

          echo "Validating ${#MANIFESTS[@]} Kubernetes manifest(s)..."

          ./kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            "${MANIFESTS[@]}"
