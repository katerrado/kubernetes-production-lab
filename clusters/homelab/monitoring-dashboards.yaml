apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-dashboards
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/katerrado/kubernetes-production-lab.git
    targetRevision: main
    path: infrastructure/monitoring/dashboards

    directory:
      include: '{longhorn-operations-dashboard-configmap.yaml}'

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
