apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring

spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system

  hostnames:
    - grafana.k8s.home

  rules:
    - backendRefs:
        - name: monitoring-grafana
          port: 80
