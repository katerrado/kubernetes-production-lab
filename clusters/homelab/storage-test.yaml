apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-test
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/katerrado/kubernetes-production-lab.git
    targetRevision: main
    path: apps/storage-test

  destination:
    server: https://kubernetes.default.svc
    namespace: storage-test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
