apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring

spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system

  hostnames:
    - prometheus.k8s.home

  rules:
    - backendRefs:
        - name: monitoring-kube-prometheus-prometheus
          port: 9090
