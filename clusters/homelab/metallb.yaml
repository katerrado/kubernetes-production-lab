apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: metallb
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.16.1
      helm:
        valueFiles:
          - $values/platform/metallb/values.yaml

    - repoURL: https://github.com/katerrado/kubernetes-production-lab.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
